name: Reusable Build and Publish Images

# Reusable workflow: builds the three application images once and publishes them
# to GHCR under an immutable sha-<commit> tag. Deployment workflows consume the
# returned references instead of rebuilding.
on:
  workflow_call:
    inputs:
      push_latest:
        description: Also tag the images as latest (use for the production branch only)
        required: false
        default: false
        type: boolean
    outputs:
      image:
        description: Product API image repository
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: Immutable image tag
        value: ${{ jobs.build.outputs.tag }}
      inspection_api_image:
        description: Inspection API image repository
        value: ${{ jobs.build.outputs.inspection_api_image }}
      inspection_web_image:
        description: Inspection web image repository
        value: ${{ jobs.build.outputs.inspection_web_image }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      inspection_api_image: ${{ steps.image.outputs.inspection_api_image }}
      inspection_web_image: ${{ steps.image.outputs.inspection_web_image }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image references and tags
        id: image
        shell: bash
        env:
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          TAG="sha-${GITHUB_SHA}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "inspection_api_image=${IMAGE}-inspection-api"
            echo "inspection_web_image=${IMAGE}-inspection-web"
          } >> "${GITHUB_OUTPUT}"
          emit_tags() {
            repository="$1"
            output="$2"
            echo "${output}<<EOF" >> "${GITHUB_OUTPUT}"
            echo "${repository}:${TAG}" >> "${GITHUB_OUTPUT}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "${repository}:latest" >> "${GITHUB_OUTPUT}"
            fi
            echo "EOF" >> "${GITHUB_OUTPUT}"
          }
          emit_tags "${IMAGE}" tags
          emit_tags "${IMAGE}-inspection-api" inspection_api_tags
          emit_tags "${IMAGE}-inspection-web" inspection_web_tags
      - name: Build and push product API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=product-crud
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=product-crud
          cache-to: type=gha,mode=max,scope=product-crud
          sbom: true
      - name: Build and push inspection API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/inspection-api
          push: true
          tags: ${{ steps.image.outputs.inspection_api_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=inspection-api
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=inspection-api
          cache-to: type=gha,mode=max,scope=inspection-api
          sbom: true
      - name: Build and push inspection web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/inspection-web
          push: true
          tags: ${{ steps.image.outputs.inspection_web_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=inspection-web
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=inspection-web
          cache-to: type=gha,mode=max,scope=inspection-web
          sbom: true
      - name: Write build summary
        run: |
          {
            echo "### Published images"
            echo
            echo "| Application | Reference |"
            echo "| --- | --- |"
            echo "| Product API | \`${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}\` |"
            echo "| Inspection API | \`${{ steps.image.outputs.inspection_api_image }}:${{ steps.image.outputs.tag }}\` |"
            echo "| Inspection web | \`${{ steps.image.outputs.inspection_web_image }}:${{ steps.image.outputs.tag }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
