name: CD Deploy

# Release and hotfix flow. Deploys an image that already exists in GHCR; it never
# rebuilds, so the artifact that passed CI on the commit is the artifact that
# ships. Triggered by a release tag or manually.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: kubernetes
        type: choice
        options:
          - kubernetes
          - docker
      environment_name:
        description: GitHub Environment that guards the deployment
        required: true
        default: production
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: Image tag to deploy (defaults to sha-<commit>)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      environment_name: ${{ steps.resolve.outputs.environment_name }}
      spring_profile: ${{ steps.resolve.outputs.spring_profile }}
      image: ${{ steps.resolve.outputs.image }}
      tag: ${{ steps.resolve.outputs.tag }}
      inspection_api_image: ${{ steps.resolve.outputs.inspection_api_image }}
      inspection_web_image: ${{ steps.resolve.outputs.inspection_web_image }}
    steps:
      - name: Resolve image references and environment
        id: resolve
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ENVIRONMENT: ${{ inputs.environment_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${INPUT_IMAGE_TAG:-sha-${GITHUB_SHA}}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="${INPUT_ENVIRONMENT:-production}"
          fi
          case "${ENVIRONMENT}" in
            development) PROFILE=dev ;;
            staging) PROFILE=staging ;;
            *) PROFILE=prod ;;
          esac
          {
            echo "target=${INPUT_TARGET:-kubernetes}"
            echo "environment_name=${ENVIRONMENT}"
            echo "spring_profile=${PROFILE}"
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "inspection_api_image=${IMAGE}-inspection-api"
            echo "inspection_web_image=${IMAGE}-inspection-web"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    with:
      target: ${{ needs.resolve.outputs.target }}
      environment_name: ${{ needs.resolve.outputs.environment_name }}
      spring_profile: ${{ needs.resolve.outputs.spring_profile }}
      image: ${{ needs.resolve.outputs.image }}
      tag: ${{ needs.resolve.outputs.tag }}
      inspection_api_image: ${{ needs.resolve.outputs.inspection_api_image }}
      inspection_web_image: ${{ needs.resolve.outputs.inspection_web_image }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
