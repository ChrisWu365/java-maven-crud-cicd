name: Java CI/CD to Azure VM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # CI phase: Lint and test
      - name: Lint and test
        run: mvn --batch-mode verify

      # CD phase 1: upload the artifact and deployment script to Azure VM
      - name: Copy Jar via SSH
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_KEY }}
          port: 22
          source: "target/*.jar,scripts/deploy.sh"
          target: "/home/${{ secrets.AZURE_VM_USER }}/app/"
          strip_components: 1

      # CD phase 2: invoke the version-controlled deployment script
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_KEY }}
          port: 22
          script: |
            APP_DIR="/home/${{ secrets.AZURE_VM_USER }}/app"
            bash "${APP_DIR}/deploy.sh" "${APP_DIR}"