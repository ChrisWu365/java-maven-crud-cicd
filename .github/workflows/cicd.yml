name: Java CI/CD with Docker

on:
  push:
    branches: [ "dev", "staging", "main" ]
  pull_request:
    branches: [ "dev", "staging", "main" ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target
        required: true
        default: kubernetes
        type: choice
        options:
          - kubernetes
          - docker

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Run tests and static analysis
        run: mvn --batch-mode verify

  publish:
    name: Publish Docker image
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image reference
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tag=sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-docker:
    name: Deploy with Docker Compose
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'docker'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v5
      - name: Copy Docker deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DOCKER_VM_IP }}
          username: ${{ secrets.DOCKER_VM_USER }}
          key: ${{ secrets.DOCKER_VM_KEY }}
          port: 22
          source: "deployment/docker,scripts/docker"
          target: "/home/${{ secrets.DOCKER_VM_USER }}/app/"
          strip_components: 0
      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: "/home/${{ secrets.DOCKER_VM_USER }}/app"
          IMAGE_REF: "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DOCKER_VM_IP }}
          username: ${{ secrets.DOCKER_VM_USER }}
          key: ${{ secrets.DOCKER_VM_KEY }}
          port: 22
          envs: APP_DIR,IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN
          script: |
            bash "${APP_DIR}/scripts/docker/deploy-docker.sh" "${APP_DIR}" "${IMAGE_REF}"

  deploy-kubernetes:
    name: Deploy to Kubernetes
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'kubernetes' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'))
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}
    concurrency:
      group: deployment-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v5
      - name: Copy Kubernetes deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.K8S_VM_IP }}
          username: ${{ secrets.K8S_VM_USER }}
          key: ${{ secrets.K8S_VM_KEY }}
          port: 22
          source: "deployment/kubernetes,scripts/kubernetes"
          target: "/home/${{ secrets.K8S_VM_USER }}/app/"
          strip_components: 0
      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: "/home/${{ secrets.K8S_VM_USER }}/app"
          IMAGE_REF: "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          GHCR_USERNAME: ${{ secrets.K8S_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.K8S_GHCR_TOKEN }}
        with:
          host: ${{ secrets.K8S_VM_IP }}
          username: ${{ secrets.K8S_VM_USER }}
          key: ${{ secrets.K8S_VM_KEY }}
          port: 22
          envs: APP_DIR,IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN
          script: |
            bash "${APP_DIR}/scripts/kubernetes/deploy-kubernetes.sh" "${APP_DIR}" "${IMAGE_REF}"
