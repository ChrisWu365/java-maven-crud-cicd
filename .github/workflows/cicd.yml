name: Java CI/CD with Docker

on:
  push:
    branches: [ "dev", "staging", "main" ]
  pull_request:
    branches: [ "dev", "staging", "main" ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target
        required: true
        default: kubernetes
        type: choice
        options:
          - kubernetes
          - docker

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests and static analysis
        run: mvn --batch-mode verify

  inspection-ci:
    name: Build inspection demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/e2e/package-lock.json
            apps/inspection-api/package-lock.json
            apps/inspection-web/package-lock.json

      - name: Install Playwright dependencies
        working-directory: apps/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps

      - name: Test and build inspection API
        working-directory: apps/inspection-api
        run: npm ci && npm run build && npm test

      - name: Test and build inspection web
        working-directory: apps/inspection-web
        run: npm ci && npm run build && npm test

      - name: Start API server
        working-directory: apps/inspection-api
        run: npm run dev &
        env:
          PORT: 4000

      - name: Start web server
        working-directory: apps/inspection-web
        run: npm run dev &

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:4000/health --timeout 30000
          npx wait-on http://localhost:5173 --timeout 30000

      - name: Run E2E tests
        working-directory: apps/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

  publish:
    name: Publish Docker image
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    needs: [ci, inspection-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      inspection_api_image: ${{ steps.image.outputs.inspection_api_image }}
      inspection_web_image: ${{ steps.image.outputs.inspection_web_image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image reference
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tag=sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "inspection_api_image=${IMAGE}-inspection-api" >> "${GITHUB_OUTPUT}"
          echo "inspection_web_image=${IMAGE}-inspection-web" >> "${GITHUB_OUTPUT}"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push inspection API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/inspection-api
          push: true
          tags: |
            ${{ steps.image.outputs.inspection_api_image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.inspection_api_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push inspection web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/inspection-web
          push: true
          tags: |
            ${{ steps.image.outputs.inspection_web_image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.inspection_web_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-docker:
    name: Deploy with Docker Compose
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'docker'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v5
      - name: Copy Docker deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DOCKER_VM_IP }}
          username: ${{ secrets.DOCKER_VM_USER }}
          key: ${{ secrets.DOCKER_VM_KEY }}
          port: 22
          source: "deployment/docker,deployment/monitoring,scripts/docker,scripts/monitoring"
          target: "/home/${{ secrets.DOCKER_VM_USER }}/app/"
          strip_components: 0
      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: "/home/${{ secrets.DOCKER_VM_USER }}/app"
          IMAGE_REF: "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          PROMETHEUS_TARGET: host.docker.internal:8080
        with:
          host: ${{ secrets.DOCKER_VM_IP }}
          username: ${{ secrets.DOCKER_VM_USER }}
          key: ${{ secrets.DOCKER_VM_KEY }}
          port: 22
          envs: APP_DIR,IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN,GRAFANA_ADMIN_PASSWORD,PROMETHEUS_TARGET
          script: |
            bash "${APP_DIR}/scripts/docker/deploy-docker.sh" "${APP_DIR}" "${IMAGE_REF}"
            sudo -n env GRAFANA_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD}" \
              PROMETHEUS_TARGET="${PROMETHEUS_TARGET}" \
              bash "${APP_DIR}/scripts/monitoring/deploy-monitoring.sh" "${APP_DIR}"

  deploy-kubernetes:
    name: Deploy to Kubernetes
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'kubernetes' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'))
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}
    concurrency:
      group: deployment-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SPRING_PROFILE: ${{ github.ref_name == 'dev' && 'dev' || github.ref_name == 'staging' && 'staging' || 'prod' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v5
      - name: Copy Kubernetes deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.K8S_VM_IP }}
          username: ${{ secrets.K8S_VM_USER }}
          key: ${{ secrets.K8S_VM_KEY }}
          port: 22
          source: "deployment/kubernetes,deployment/monitoring,scripts/kubernetes"
          target: "/home/${{ secrets.K8S_VM_USER }}/app/"
          strip_components: 0
      - name: Deploy image over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: "/home/${{ secrets.K8S_VM_USER }}/app"
          IMAGE_REF: "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          SPRING_PROFILE: ${{ env.SPRING_PROFILE }}
          INSPECTION_API_IMAGE: "${{ needs.publish.outputs.inspection_api_image }}:${{ needs.publish.outputs.tag }}"
          INSPECTION_WEB_IMAGE: "${{ needs.publish.outputs.inspection_web_image }}:${{ needs.publish.outputs.tag }}"
          GHCR_USERNAME: ${{ secrets.K8S_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.K8S_GHCR_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.INSPECTION_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.INSPECTION_AI_API_KEY }}
          AI_PROVIDER_URL: ${{ secrets.INSPECTION_AI_PROVIDER_URL }}
          AI_MODEL: ${{ secrets.INSPECTION_AI_MODEL }}
        with:
          host: ${{ secrets.K8S_VM_IP }}
          username: ${{ secrets.K8S_VM_USER }}
          key: ${{ secrets.K8S_VM_KEY }}
          port: 22
          envs: APP_DIR,IMAGE_REF,SPRING_PROFILE,INSPECTION_API_IMAGE,INSPECTION_WEB_IMAGE,GHCR_USERNAME,GHCR_TOKEN,GRAFANA_ADMIN_PASSWORD,JWT_SECRET,AI_API_KEY,AI_PROVIDER_URL,AI_MODEL
          script: |
            GRAFANA_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD}" \
              JWT_SECRET="${JWT_SECRET}" \
              AI_API_KEY="${AI_API_KEY}" \
              AI_PROVIDER_URL="${AI_PROVIDER_URL}" \
              AI_MODEL="${AI_MODEL}" \
              bash "${APP_DIR}/scripts/kubernetes/deploy-kubernetes.sh" "${APP_DIR}" "${IMAGE_REF}" "${SPRING_PROFILE}" "${INSPECTION_API_IMAGE}" "${INSPECTION_WEB_IMAGE}"
