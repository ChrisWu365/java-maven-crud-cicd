apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-crud
  labels:
    app: product-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-crud
  template:
    metadata:
      labels:
        app: product-crud
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: product-crud
          image: IMAGE_REF
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: __SPRING_PROFILE__
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
