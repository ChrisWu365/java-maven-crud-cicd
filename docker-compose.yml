services:
  product-crud:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REF:-product-crud:local}
    container_name: product-crud
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
