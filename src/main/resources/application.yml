spring:
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:cruddb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    com.example.crud.product: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
